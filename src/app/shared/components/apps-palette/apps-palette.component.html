
<div class="apps-palette">
    <app-profile-image></app-profile-image>

    @if (userHasAnyRoleForApps(appStore.user())) {
    <mat-divider></mat-divider>
    @for (i of apps; track i.id)  {
    @if (!isCurrentApp(i.sys_name) && userHasAnyRoleForApp(appStore.user(), i.id)) {
    <div>
        @if (!i.disabled) {
            <a href="{{i.url}}">
                <mat-icon
                        [matTooltipClass]="'app-accent'"
                        [matTooltip]="i.hint"
                        matTooltipHideDelay="50000"
                        matTooltipPosition="right"
                >{{i.icon}}</mat-icon>
            </a>
        } @else {
            <mat-icon
                    class="disabled"
                    [matTooltipClass]="'app-accent'"
                    [matTooltip]="i.hint"
                    matTooltipHideDelay="50000"
                    matTooltipPosition="right"
            >{{i.icon}}</mat-icon>
        }
    </div>
    }
    }
    }
