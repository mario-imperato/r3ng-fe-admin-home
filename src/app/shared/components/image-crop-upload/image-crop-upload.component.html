<div class="cropper-action-bar">
    <mat-icon color='accent' (click)='upload()'>upload</mat-icon>
    <mat-icon color='primary' (click)='close()'>close</mat-icon>
</div>
<image-cropper
        [imageChangedEvent]="imageChangedEvent"
        [imageFile]="imageInfo.fileObj"
        [maintainAspectRatio]="this.maintainAspectRatio"
        [aspectRatio]="this.aspectRatio"
        [format]="this.format"
        [resizeToWidth]="this.width"
        [alignImage]="'center'"
        [resizeToHeight]="this.height"
        (imageCropped)="imageCropped($event)"
        (imageLoaded)="imageLoaded($event)"
        (cropperReady)="cropperReady()"
        (loadImageFailed)="loadImageFailed()"

        output="blob"
></image-cropper>
